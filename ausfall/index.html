<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tage ohne IT-Ausfall</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f1f1f;
    --muted: #8a8a8a;
    --accent: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececec; --muted: #9b9b9b; --accent: #66bb6a; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { text-align: center; padding: 24px; }
  .zahl {
    font-size: clamp(64px, 22vmin, 140px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .label {
    margin-top: 10px;
    font-size: clamp(15px, 3.5vmin, 20px);
    font-weight: 500;
  }
  .seit {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .reset {
    margin-top: 18px;
    font-size: 12px;
  }
  .reset a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  .reset a:hover { color: var(--fg); border-bottom-color: var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="zahl" id="zahl">–</div>
    <div class="label" id="label">Tage ohne IT-Ausfall</div>
    <div class="seit" id="seit"></div>
    <div class="reset"><a id="resetlink" href="#" target="_blank" rel="noopener">Ausfall melden → Zähler auf 0</a></div>
  </div>
<script>
  const EDIT_URL = "https://github.com/shnsn/fallzahl-dashboard/edit/main/ausfall/status.json";
  document.getElementById("resetlink").href = EDIT_URL;

  function berlinDatum(d) {
    // Datum (ohne Uhrzeit) in deutscher Zeitzone
    const s = d.toLocaleDateString("en-CA", { timeZone: "Europe/Berlin" });
    return new Date(s + "T00:00:00Z");
  }

  fetch("./status.json?ts=" + Date.now())
    .then(r => r.json())
    .then(({ lastOutage }) => {
      const von = new Date(lastOutage + "T00:00:00Z");
      const heute = berlinDatum(new Date());
      const tage = Math.max(0, Math.round((heute - von) / 86400000));
      document.getElementById("zahl").textContent = tage;
      document.getElementById("label").textContent =
        (tage === 1 ? "Tag" : "Tage") + " ohne IT-Ausfall";
      document.getElementById("seit").textContent =
        "seit " + von.toLocaleDateString("de-DE",
          { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
    })
    .catch(() => {
      document.getElementById("zahl").textContent = "?";
      document.getElementById("seit").textContent = "status.json nicht erreichbar";
    });
</script>
</body>
</html>
